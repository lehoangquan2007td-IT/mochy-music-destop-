[workspace]
resolver = "2"
members = [
    "crates/mochy-core",
    "crates/mochy-audio",
    "crates/mochy-innertube",
    "crates/mochy-lyrics",
    "crates/mochy-storage",
    "crates/mochy-app",
    "crates/mochy-download",
    "crates/mochy-integrations",
    "crates/mochy-importer",
    "crates/mochy-signin",
]

[workspace.package]
version = "0.1.8"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Mochy Music Desktop contributors"]
repository = "https://github.com/realidkroo/mochy-music"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
