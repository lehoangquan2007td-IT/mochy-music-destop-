[package]
name = "mochy-lyrics"
description = "Lyrics providers (YouTube Music/captions/transcript, embedded tags, Apple Music/BetterLyrics, YouLyPlus, Paxsenix, lrc.red, SimpMusic, LRCLIB, Deezer, NetEase, QQ Music, KuGou) + LRC/TTML parsing, romanization, Google translation"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mochy-core = { path = "../mochy-core" }
mochy-innertube = { path = "../mochy-innertube" }
base64 = "0.22.1"
futures = "0.3.34"
kakasi = "0.1.0"
percent-encoding = "2.3.2"
pinyin = { version = "0.11.0", default-features = false, features = ["plain"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "gzip", "deflate", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
unicode-normalization = "0.1.26"
