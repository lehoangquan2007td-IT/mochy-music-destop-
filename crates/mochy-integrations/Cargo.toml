[package]
name = "mochy-integrations"
description = "Discord Rich Presence (local IPC) and Last.fm / Libre.fm scrobbling"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mochy-core = { path = "../mochy-core" }
form_urlencoded = "1.2.2"
md-5 = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "gzip", "deflate", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "io-util", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
