[package]
name = "mochy-download"
description = "Downloads / export: ranged HTTPS fetch, WebM-Opus -> Ogg Opus remux, tags + cover art, file naming, lyrics file import"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mochy-lyrics = { path = "../mochy-lyrics" }
base64 = "0.22.1"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
lofty = "0.25.5"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
mochy-core = { path = "../mochy-core" }
mochy-innertube = { path = "../mochy-innertube" }
